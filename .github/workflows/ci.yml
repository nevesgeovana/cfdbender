name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # gmsh needs libGLU on Linux. The runner image may already carry it; the
      # apt mirrors have failed DNS resolution on hosted runners, so retry.
      - name: Install libGLU for gmsh
        if: runner.os == 'Linux'
        run: |
          if ldconfig -p | grep -q libGLU.so.1; then echo "libGLU present"; exit 0; fi
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y libglu1-mesa; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then echo "apt attempt $attempt failed; retrying"; sleep 30; fi
          done
          exit 1
      - run: python -m pip install -e ".[dev,docs]"
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python tools/check_public_text.py
      - run: python -m ruff format --check .
      - run: python -m mypy src
      - run: python tools/check_architecture.py
      - run: python -m build --wheel
