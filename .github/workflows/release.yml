# Release workflow: builds cfdbender, tests the built wheel, and publishes it to PyPI through
# trusted publishing (no token). PyPI must list this repository as a trusted publisher
# (project cfdbender, workflow release.yml, environment pypi). Triggered by version tags only;
# the tag must equal the version in pyproject.toml.
name: release

on:
  push:
    tags: ["v*"]
  # A manual run builds and tests the wheel without publishing (a dry run before tagging).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Tag equals the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then echo "tag $TAG differs from version $VERSION"; exit 1; fi
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: dist/

  test:
    needs: build
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist/
      # gmsh needs libGLU on Linux, as in ci.yml.
      - name: Install libGLU for gmsh
        if: runner.os == 'Linux'
        run: |
          if ldconfig -p | grep -q libGLU.so.1; then echo "libGLU present"; exit 0; fi
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y libglu1-mesa; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then echo "apt attempt $attempt failed; retrying"; sleep 30; fi
          done
          exit 1
      - name: Install the built wheel with the test extras
        shell: bash
        run: |
          WHEEL=$(ls dist/*.whl)
          python -m pip install "${WHEEL}[dev,docs]"
      - name: Test the installed wheel, not the checkout
        run: python -m pytest -q -o pythonpath= -p no:cacheprovider

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
