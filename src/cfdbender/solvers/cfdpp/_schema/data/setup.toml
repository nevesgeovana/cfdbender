# Binding of the setup and post-processing keys to mcfd.inp for 22.5.U3. The key names are
# cfdbender's own; each binding names where its value is written: a keyword, a list of keywords one
# value each, or a variable of the equation set. A dotted name is a key of a table of the setup
# file (physics.method is method in [physics]). No entry holds a default: a required key is stated
# by the user, a source = "case" value is stated by cfdbender. A binding is harvested when the
# saved inputs tie the key to its keyword; every such status cites the committed report.

[[setup]]
name = "iterations"
type = "int"
required = true
above = 0
keyword = "ntstep"
status = { "22.5.U3" = { status = "harvested", report = "reports/cfdpp/CMP-22.5.U3_2026-11-18_harvest-grammar.yaml" } }

