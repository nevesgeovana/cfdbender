# Layout of mcfd.inp as seen in the inputs the GUI of 22.5.U3 saved: the order of the sections, how
# each opens and closes, the comment prefix, the layout of the information sets and of the boundary
# rows, and the line ending. Every status cites the committed report under reports/cfdpp/. No entry
# holds a default value.
#
# raw_section is not set: no harvested input shows a section that accepts a keyword the solver
# does not know, so a raw keyword unknown to the database names its section with a section hint.

[grammar]
number_format = { real = "shortest" }
line_ending = "crlf"
comment = "#"
infosets = { header = "seq.# {index} #vals {count} title {tag}", values = "values", per_line = 5, trailing_space = true }
boundaries = { width = 4, family = true }
every_section = true

[[sections]]
name = "system"
order = 1
kind = "lines"
open = "system begin"
close = "system end"
status = { "22.5.U3" = { status = "harvested", report = "reports/cfdpp/CMP-22.5.U3_2026-11-18_harvest-grammar.yaml" } }

