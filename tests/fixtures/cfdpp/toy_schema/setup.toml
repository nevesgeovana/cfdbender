# Invented binding of the setup and post-processing keys to the toy input. The key names
# are cfdbender's own; the keywords they set are made up. A dotted name is a key of a
# table of the setup file (physics.method is method in [physics]). No entry holds a
# default value: required keys are stated by the user, the rest are read only when they
# apply.

[[setup]]
name = "iterations"
type = "int"
required = true
above = 0
keyword = "tsteps"
meaning = "steps of the run"
locator = "TOY :: setup, iterations"
status = { "1.0" = { status = "harvested", report = "reports/toy/CMP-1.0_2026-01-01_toy.yaml" }, "2.0" = { status = "harvested", report = "reports/toy/CMP-2.0_2026-01-01_toy.yaml" } }

