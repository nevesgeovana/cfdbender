site_name: cfdbender
site_description: Solver-agnostic CFD workspace
site_url: https://nevesgeovana.github.io/cfdbender/
repo_url: https://github.com/nevesgeovana/cfdbender
theme:
  name: material
  logo: assets/sticker_white.png
  favicon: assets/favicon-white.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.tabs
    - navigation.sections
    - navigation.instant
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
plugins:
  - search
  - gen-files:
      scripts:
        - scripts/srs_generate.py
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.emoji
  - pymdownx.highlight
  - toc:
      permalink: true
extra_css:
  - stylesheets/extra.css
nav:
  - Home: index.md
  - Start here:
      - Install: install.md
      - First campaign: getting-started.md
  - Workflow:
      - The workflow: workflow.md
      - Workspace layout: workspace-layout.md
      - Matrix columns: matrix-columns.md
      - Executables: executables.md
      - Run again, resume, records: records.md
      - Results and tables: results.md
      - Cluster jobs: cluster-jobs.md
      - Storage and sync: storage.md
      - Troubleshooting: troubleshooting.md
  - Solvers:
      - Side by side: solvers.md
      - SU2: su2-workspaces.md
      - OpenFOAM: openfoam-workspaces.md
      - PyFR: pyfr-workspaces.md
      - XFOIL: xfoil-workspaces.md
      - QPROP: qprop-workspaces.md
      - FlightStream: flightstream-workspaces.md
  - Commands: cli.md
  - Reference:
      - Architecture: architecture.md
      - Adapter contract: adapter-contract.md
      - Requirements: requirements/index.md
exclude_docs: |
  /unpublished/
